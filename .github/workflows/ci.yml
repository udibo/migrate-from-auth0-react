name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Upstream's component tests (jest, jsdom).
      - run: npm test
      # Builds the app, then tests both servers with no identity provider.
      - run: npm run test:behavior
      # Signs in through @udibo/oauth2's local identity provider, seeded from
      # e2e/idp.json, with no secrets. live-tenant.yml runs the same tests
      # against the Auth0 tenant.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
