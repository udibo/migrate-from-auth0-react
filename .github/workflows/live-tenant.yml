name: Live tenant

# Runs the browser tests against the Udibo test tenant the app moves to at
# step 2, and against the Auth0 development tenant it moves from, one job
# each. The tenants hold synthetic users only. Every value comes from the
# repository's secrets; see "Set up the Udibo tenant" and "Set up the Auth0
# tenant" in the README. A job whose secrets are missing reports that it
# skipped and passes.
#
# The weekly run (Mondays) and a manual run test the pinned @udibo/oauth2. On
# the other days the job runs only when npm names a newer @udibo/oauth2 that
# has not yet passed here, and tests that release, so a release that breaks
# sign-in through Auth0 shows up the day it is published.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: live-tenant
  cancel-in-progress: false

jobs:
  test:
    name: Test against the ${{ matrix.provider }} tenant
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [udibo, auth0]
    steps:
      # The secrets reach only this step and the test step, never npm ci's
      # install scripts.
      - name: Check the tenant is configured
        id: configured
        env:
          PROVIDER: ${{ matrix.provider }}
          AUTH0_DOMAIN: ${{ matrix.provider == 'auth0' && secrets.AUTH0_DOMAIN || '' }}
          AUTH0_CLIENT_ID: ${{ matrix.provider == 'auth0' && secrets.AUTH0_CLIENT_ID || '' }}
          AUTH0_AUDIENCE: ${{ matrix.provider == 'auth0' && secrets.AUTH0_AUDIENCE || '' }}
          AUTH0_TEST_USERNAME: ${{ matrix.provider == 'auth0' && secrets.AUTH0_TEST_USERNAME || '' }}
          AUTH0_TEST_PASSWORD: ${{ matrix.provider == 'auth0' && secrets.AUTH0_TEST_PASSWORD || '' }}
          UDIBO_ISSUER: ${{ matrix.provider == 'udibo' && secrets.UDIBO_ISSUER || '' }}
          UDIBO_CLIENT_ID: ${{ matrix.provider == 'udibo' && secrets.UDIBO_CLIENT_ID || '' }}
          UDIBO_AUDIENCE: ${{ matrix.provider == 'udibo' && secrets.UDIBO_AUDIENCE || '' }}
          UDIBO_TEST_USERNAME: ${{ matrix.provider == 'udibo' && secrets.UDIBO_TEST_USERNAME || '' }}
          UDIBO_TEST_PASSWORD: ${{ matrix.provider == 'udibo' && secrets.UDIBO_TEST_PASSWORD || '' }}
        run: |
          if [ "$PROVIDER" = "udibo" ]; then
            required="UDIBO_ISSUER UDIBO_CLIENT_ID UDIBO_AUDIENCE UDIBO_TEST_USERNAME UDIBO_TEST_PASSWORD"
          else
            required="AUTH0_DOMAIN AUTH0_CLIENT_ID AUTH0_AUDIENCE AUTH0_TEST_USERNAME AUTH0_TEST_PASSWORD"
          fi
          missing=""
          for name in $required; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Live tenant skipped ($PROVIDER)::No $PROVIDER tenant is configured (missing:$missing). Add the repository secrets listed in the README."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Choose the @udibo/oauth2 release to test
        id: release
        if: steps.configured.outputs.ready == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          pinned=$(node -p 'require("./package.json").dependencies["@udibo/oauth2"]')
          if [ "$EVENT" != "schedule" ] || [ "$(date -u +%u)" = "1" ]; then
            echo "Testing the pinned @udibo/oauth2 $pinned."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif ! latest=$(npm view @udibo/oauth2 version) || [ -z "$latest" ]; then
            echo "::warning title=npm unreachable::Could not read the latest @udibo/oauth2 from npm; testing the pinned $pinned instead."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$latest" != "$pinned" ]; then
            echo "candidate=$latest" >> "$GITHUB_OUTPUT"
          else
            echo "No @udibo/oauth2 release newer than $pinned; nothing to test today."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # A release that passed leaves a cache entry named for it, so the daily
      # check tests each new release once. A failed run saves nothing, so it
      # tries again the next day.
      - name: Look up whether this release already passed
        id: tested
        if: steps.release.outputs.candidate != ''
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .oauth2-release-tested
          key: live-tenant-${{ matrix.provider }}-udibo-oauth2-${{ steps.release.outputs.candidate }}
          lookup-only: true
      - name: Test the newer release unless it already passed
        id: candidate
        if: steps.release.outputs.candidate != ''
        env:
          VERSION: ${{ steps.release.outputs.candidate }}
          HIT: ${{ steps.tested.outputs.cache-hit }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          if [ "$HIT" = "true" ]; then
            echo "@udibo/oauth2 $VERSION already passed against the $PROVIDER tenant; nothing to test today."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=New @udibo/oauth2::Testing $VERSION, newer than the pinned release."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.release.outputs.run == 'true' || steps.candidate.outputs.run == 'true'
        run: npm ci
      - if: steps.candidate.outputs.run == 'true'
        env:
          VERSION: ${{ steps.release.outputs.candidate }}
        run: npm install --no-save "@udibo/oauth2@$VERSION"
      - if: steps.release.outputs.run == 'true' || steps.candidate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.release.outputs.run == 'true' || steps.candidate.outputs.run == 'true'
        run: npm run test:e2e
        env:
          E2E_PROVIDER: ${{ matrix.provider }}
          AUTH0_DOMAIN: ${{ matrix.provider == 'auth0' && secrets.AUTH0_DOMAIN || '' }}
          AUTH0_CLIENT_ID: ${{ matrix.provider == 'auth0' && secrets.AUTH0_CLIENT_ID || '' }}
          AUTH0_AUDIENCE: ${{ matrix.provider == 'auth0' && secrets.AUTH0_AUDIENCE || '' }}
          AUTH0_TEST_USERNAME: ${{ matrix.provider == 'auth0' && secrets.AUTH0_TEST_USERNAME || '' }}
          AUTH0_TEST_PASSWORD: ${{ matrix.provider == 'auth0' && secrets.AUTH0_TEST_PASSWORD || '' }}
          UDIBO_ISSUER: ${{ matrix.provider == 'udibo' && secrets.UDIBO_ISSUER || '' }}
          UDIBO_CLIENT_ID: ${{ matrix.provider == 'udibo' && secrets.UDIBO_CLIENT_ID || '' }}
          UDIBO_AUDIENCE: ${{ matrix.provider == 'udibo' && secrets.UDIBO_AUDIENCE || '' }}
          UDIBO_TEST_USERNAME: ${{ matrix.provider == 'udibo' && secrets.UDIBO_TEST_USERNAME || '' }}
          UDIBO_TEST_PASSWORD: ${{ matrix.provider == 'udibo' && secrets.UDIBO_TEST_PASSWORD || '' }}
          # Optional: the audience test skips without them; the rest run.
          AUTH0_OTHER_AUDIENCE_CLIENT_ID: ${{ matrix.provider == 'auth0' && secrets.AUTH0_OTHER_AUDIENCE_CLIENT_ID || '' }}
          AUTH0_OTHER_AUDIENCE_CLIENT_SECRET: ${{ matrix.provider == 'auth0' && secrets.AUTH0_OTHER_AUDIENCE_CLIENT_SECRET || '' }}
          UDIBO_OTHER_AUDIENCE_CLIENT_ID: ${{ matrix.provider == 'udibo' && secrets.UDIBO_OTHER_AUDIENCE_CLIENT_ID || '' }}
          UDIBO_OTHER_AUDIENCE_CLIENT_SECRET: ${{ matrix.provider == 'udibo' && secrets.UDIBO_OTHER_AUDIENCE_CLIENT_SECRET || '' }}
      - name: Record that this release passed
        if: steps.candidate.outputs.run == 'true'
        env:
          VERSION: ${{ steps.release.outputs.candidate }}
        run: echo "$VERSION" > .oauth2-release-tested
      - if: steps.candidate.outputs.run == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .oauth2-release-tested
          key: live-tenant-${{ matrix.provider }}-udibo-oauth2-${{ steps.release.outputs.candidate }}
