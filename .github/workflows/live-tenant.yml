name: Live tenant

# Runs the browser tests against the Auth0 development tenant. The tenant
# holds synthetic users only. Every value comes from the repository's secrets;
# see "Test against an Auth0 tenant" in the README. Without them the job
# reports that it skipped and passes.
#
# The weekly run (Mondays) and a manual run test the pinned @udibo/oauth2. On
# the other days the job runs only when npm names a newer @udibo/oauth2, and
# tests that release, so a release that breaks sign-in through Auth0 shows up
# the day it is published.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: live-tenant
  cancel-in-progress: false

jobs:
  test:
    name: Test against the Auth0 tenant
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The secrets reach only this step and the test step, never npm ci's
      # install scripts.
      - name: Check the tenant is configured
        id: configured
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          AUTH0_TEST_USERNAME: ${{ secrets.AUTH0_TEST_USERNAME }}
          AUTH0_TEST_PASSWORD: ${{ secrets.AUTH0_TEST_PASSWORD }}
        run: |
          missing=""
          for name in AUTH0_DOMAIN AUTH0_CLIENT_ID AUTH0_AUDIENCE AUTH0_TEST_USERNAME AUTH0_TEST_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Live tenant skipped::No Auth0 tenant is configured (missing:$missing). Add the AUTH0_* repository secrets listed in the README."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Choose the @udibo/oauth2 release to test
        id: release
        if: steps.configured.outputs.ready == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          pinned=$(node -p 'require("./package.json").dependencies["@udibo/oauth2"]')
          latest=$(npm view @udibo/oauth2 version)
          if [ "$EVENT" != "schedule" ] || [ "$(date -u +%u)" = "1" ]; then
            echo "Testing the pinned @udibo/oauth2 $pinned."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$latest" != "$pinned" ]; then
            echo "::notice title=New @udibo/oauth2::Testing $latest, newer than the pinned $pinned."
            echo "install=$latest" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No @udibo/oauth2 release newer than $pinned; nothing to test today."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.release.outputs.run == 'true'
        run: npm ci
      - if: steps.release.outputs.install != ''
        env:
          VERSION: ${{ steps.release.outputs.install }}
        run: npm install --no-save "@udibo/oauth2@$VERSION"
      - if: steps.release.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.release.outputs.run == 'true'
        run: npm run test:e2e
        env:
          E2E_PROVIDER: auth0
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          AUTH0_TEST_USERNAME: ${{ secrets.AUTH0_TEST_USERNAME }}
          AUTH0_TEST_PASSWORD: ${{ secrets.AUTH0_TEST_PASSWORD }}
          # Optional: the audience test skips without them; the rest run.
          AUTH0_OTHER_AUDIENCE_CLIENT_ID: ${{ secrets.AUTH0_OTHER_AUDIENCE_CLIENT_ID }}
          AUTH0_OTHER_AUDIENCE_CLIENT_SECRET: ${{ secrets.AUTH0_OTHER_AUDIENCE_CLIENT_SECRET }}
